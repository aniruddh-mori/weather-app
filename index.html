<!doctype html>
<html lang="en">
  <head>
    <title>Weather Api</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <form action="#" id="weatherapi">
      <div class="container">
        <h2>Weather App 🌤️</h2>
        <input type="text" id="placename" placeholder="Enter City Name" />
        <div class="btn">
          <input
            type="submit"
            id="btn"
            placeholder="Get Weather"
            value="Get Weather"
          />
        </div>
        <p id="loader" style="display: none; text-align: center">Loading...</p>
        <div class="info">
          <div class="icon">
            <img id="icon" style="display: none; width: 50px" />
            <p id="name"></p>
          </div>
          <p id="cdn"></p>
          <p id="temp"></p>
          <p id="region"></p>
          <p id="humidity"></p>
          <p id="wind"></p>
        </div>
      </div>
    </form>
    <script src="script.js"></script>
  </body>
</html>
